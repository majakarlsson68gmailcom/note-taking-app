<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="top-actions container">
            <h1>Notes</h1>
            <button class="toggle-darkmode secondary" id="toggle-darkmode">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="currentColor">
                    <path
                        d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z" />
                </svg>
                <span class="visually-hidden">Toggle darkmode</span>
            </button>
        </div>
    
        <div class="actions-header container">
            <form action="" class="search-form">
                <label for="search-notes">Search notes</label>
                <input type="search" id="search-notes" name="search">
                <button type="submit" id="search-btn" class="search-btn secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                        fill="currentColor">
                        <path
                            d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
                    </svg>Search</button>
                    <button class="primary" id="add-note-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                            fill="currentColor">
                            <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
                        </svg>
                        Add Note
                    </button>
            </form>
        </div>
    </header>

    <main>
        <section class="container">
            <h2>My notes</h2>

            <div class="notes-grid container">
                <!-- Notes will go here -->
                 
            </div>
            </section>

            <dialog class="new-note-modal" id="note-dialog">
                <button class="close-btn secondary" id="close-btn">
                    <svg class="close-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                </button>
                
                <h3> New Note</h3>
               
                <form class="new-note-form">
                    <div class="form-container">
                        <label for="note-title">Title:</label>
                        <input type="text" id="note-title" required>
                    </div>

                    <div class="form-container">
                        <label for="note-content">Note content:</label>
                        <textarea name="content" id="note-content" rows="7"></textarea>
                    </div>
                    <button class="save-btn primary" id="save-btn">Save</button>
                </form>
            </dialog>
    </main>

    <!-- Card template -->
    <template id="card-template">
        <article class="note-card">
            <!-- example note -->
             <header class="card-header">
                <div class="title">
                    <h3 class="card-title">JavaScript</h3>
                    <span class="note-date">2026-07-11</span>
                </div>

                <div class="card-actions">
                    <button class="edit-btn secondary" aria-label="edit note">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/></svg>
                    </button>
                    <button class="delete-btn secondary" aria-label="delete note">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
                    </button>
                </div>
             </header>

             <p class="note-content">
                Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ducimus unde at nemo tenetur numquam repellat aliquid repellendus error quibusdam iusto hic a rerum facilis, ex quidem corporis laborum? Distinctio, quaerat.
             </p>
         </article>
     </template>
</body>
</html>
